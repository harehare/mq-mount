[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "filesystem", "text-processing"]
description = "FUSE-mount a Markdown file as a virtual filesystem: headings become directories, section bodies become files"
edition = "2024"
homepage = "https://mqlang.org/"
keywords = ["markdown", "fuse", "filesystem", "mq"]
license = "MIT"
name = "mq-mount"
readme = "README.md"
repository = "https://github.com/harehare/mq-mount"
version = "0.1.0"

[[bin]]
name = "mq-mount"
path = "src/main.rs"

[features]
default = ["mount"]
# The NFSv3-server-backed mount. Split out so `document`/`inode`'s core logic
# builds and tests without pulling in the server/runtime dependencies.
mount = ["dep:nfsserve", "dep:tokio", "dep:async-trait"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
clap = {version = "4.6.1", features = ["derive"]}
libc = "0.2"
miette = {version = "7.6.0", features = ["fancy"]}
mq-markdown = "0.8.2"
nfsserve = { version = "0.11.0", optional = true }
rustc-hash = "2.1.2"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"], optional = true }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
